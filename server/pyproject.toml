[project]
name = "nonverbal-server"
version = "0.1.0"
description = "Pipecat voice bot that folds browser-detected nonverbal cues into LLM context"
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[anthropic,cartesia,deepgram,runner,silero,webrtc,webrtc-video]>=1.15.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
