[project]
name = "nonverbal-bot"
version = "0.1.0"
description = "Pipecat voice bot that folds browser-detected nonverbal cues into LLM context"
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[anthropic,cartesia,deepgram,moondream,runner,silero,webrtc,webrtc-video]>=1.16.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
